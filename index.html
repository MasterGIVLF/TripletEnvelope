<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triplet interactif</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:20px auto;padding:0 15px;color:#20242b}h2{font-size:1.35rem} .control{display:grid;grid-template-columns:110px 1fr 85px;gap:12px;align-items:center;margin:18px 0}input[type=range]{width:100%;height:32px;touch-action:pan-y;accent-color:#2361c5}input[type=number]{font-size:16px;width:78px;padding:7px;border:1px solid #aaa;border-radius:5px}svg{width:100%;height:auto;touch-action:pan-y} .hint{color:#555;font-size:.9rem}button{padding:10px 18px;font-size:16px} @media(max-width:520px){.control{grid-template-columns:66px 1fr 72px;gap:7px}input[type=number]{width:65px}}</style></head><body><h2>Triplet de quadrupôles · Protons 10 MeV</h2><p class="hint">Enveloppes rms calculées par matrices de transfert de quadrupôles épais, sans charge d'espace. Faisceau initial : ε<sub>n,rms</sub> = 0,01 mm·mrad, β<sub>Twiss</sub> = 10 m, α = 0.</p><div id="controls"></div><button id="reset">Réinitialiser</button><svg id="plot" viewBox="0 0 950 530" role="img" aria-label="Enveloppes horizontale et verticale en fonction de la position"></svg><p id="status" aria-live="polite"></p><script>
const defaults=[0,0,0], bounds=[[-40,40],[-60,60],[-40,40]], values=[...defaults], controls=document.getElementById('controls'),svg=document.getElementById('plot');
for(let i=0;i<3;i++){let d=document.createElement('div');d.className='control';let l=document.createElement('label');l.textContent='G'+(i+1)+' (T/m)';l.htmlFor='range'+i;let r=document.createElement('input');r.type='range';r.id='range'+i;r.min=bounds[i][0];r.max=bounds[i][1];r.step='0.05';r.value=values[i];let n=document.createElement('input');n.type='number';n.min=r.min;n.max=r.max;n.step='0.05';n.value=values[i];r.addEventListener('input',()=>{values[i]=+r.value;n.value=r.value;draw()});n.addEventListener('input',()=>{if(n.value==='')return;let v=+n.value;if(!Number.isFinite(v))return;values[i]=Math.max(+r.min,Math.min(+r.max,v));r.value=values[i];draw()});d.append(l,r,n);controls.append(d)}
document.getElementById('reset').onclick=()=>{values.splice(0,3,...defaults);[...controls.children].forEach((d,i)=>{d.children[1].value=values[i];d.children[2].value=values[i]});draw()};
const E=10,mp=938.272088,bg=Math.sqrt((1+E/mp)**2-1),brho=Math.sqrt(E*(E+2*mp))/299.792458,eps=1e-8/bg;const sig0=[[eps*10,0],[0,eps/10]];
function mult(A,B){return [[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]]}
function trans(k,L){if(Math.abs(k)<1e-13)return [[1,L],[0,1]];let q=Math.sqrt(Math.abs(k));if(k>0)return [[Math.cos(q*L),Math.sin(q*L)/q],[-q*Math.sin(q*L),Math.cos(q*L)]];return [[Math.cosh(q*L),Math.sinh(q*L)/q],[q*Math.sinh(q*L),Math.cosh(q*L)]]}
function sigma(M){return 1e3*Math.sqrt(Math.max(0,eps*(10*M[0][0]**2+M[0][1]**2/10)))}
function calc(){let elems=[[.1,0],[.1,values[0]/brho],[.1,0],[.1,values[1]/brho],[.1,0],[.1,values[2]/brho],[2,0]],Mx=[[1,0],[0,1]],My=[[1,0],[0,1]],s=0,pts=[[0,sigma(Mx),sigma(My)]];for(let [L,k] of elems){let N=Math.ceil(L/.005),ds=L/N,Tx=trans(k,ds),Ty=trans(-k,ds);for(let j=0;j<N;j++){Mx=mult(Tx,Mx);My=mult(Ty,My);s+=ds;pts.push([s,sigma(Mx),sigma(My)])}}return pts}
function draw(){let pts=calc(),max=Math.max(1.2,...pts.map(p=>Math.max(p[1],p[2])))*1.13;let x=s=>70+s/2.7*845,y=v=>260-v/max*205;let a=[];a.push('<rect x="0" y="0" width="950" height="530" fill="white"/>');for(let v=-Math.ceil(max);v<=Math.ceil(max);v+=Math.max(0.5,Math.ceil(max/4*2)/2)){if(Math.abs(v)>max)continue;a.push(`<line x1="70" y1="${y(v)}" x2="915" y2="${y(v)}" stroke="#e0e3e8"/><text x="59" y="${y(v)+5}" text-anchor="end" font-size="15" fill="#555">${v}</text>`)}for(let s=0;s<=2.7;s+=.3)a.push(`<line x1="${x(s)}" y1="55" x2="${x(s)}" y2="465" stroke="#f0f0f0"/><text x="${x(s)}" y="488" text-anchor="middle" font-size="15" fill="#555">${s.toFixed(1)}</text>`);[[.1,.2],[.3,.4],[.5,.6]].forEach(([a0,b0],i)=>a.push(`<rect x="${x(a0)}" y="55" width="${x(b0)-x(a0)}" height="410" fill="${i===1?'#f4a5a5':'#a5d4f3'}" opacity=".35"/>`));a.push(`<line x1="70" y1="${y(0)}" x2="915" y2="${y(0)}" stroke="#555"/>`);for(let [idx,color] of [[1,'#2164cc'],[2,'#d62828']])for(let sign of [1,-1]){let d=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(2)+','+y(sign*p[idx]).toFixed(2)).join(' ');a.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>`)}a.push('<text x="495" y="520" text-anchor="middle" font-size="19">s (m)</text><text x="21" y="260" transform="rotate(-90 21 260)" text-anchor="middle" font-size="19">Enveloppe rms (mm)</text><text x="745" y="37" fill="#2164cc" font-size="19">σx</text><text x="810" y="37" fill="#d62828" font-size="19">σy</text>');svg.innerHTML=a.join('');let last=pts.at(-1);document.getElementById('status').textContent=`À s = 2,70 m : σx = ${last[1].toFixed(3)} mm ; σy = ${last[2].toFixed(3)} mm.`}
draw();</script><div style="position:fixed;bottom:8px;left:12px;font-family:system-ui,-apple-system,sans-serif;font-size:11px;color:#888;pointer-events:none;z-index:10">Master GI-PLATO 2026 - V. Le Flanchec</div></body></html>
